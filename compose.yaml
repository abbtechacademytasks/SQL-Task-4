services:
  postgres:
    image: postgres:17
    container_name: sql-task-14-postgres
    environment:
      POSTGRES_DB: sql_task_14
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sql_task_14"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
